# AlgoTrading main settings
# Every value here is validated by pydantic in algotrading/config.py.

# --- Trading mode ---
# paper: simulated fills against live Binance public prices (no API keys needed)
# live:  real orders via authenticated Binance API (requires keys + explicit review)
mode: paper

market:
  exchange: binance
  symbols:
    - BTC/USDT
    - ETH/USDT
  intervals:
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 4h
    - 1d
  backfill_days: 30
  poll_seconds: 60
  max_staleness_seconds: 300

risk:
  paper_initial_balance: 10000.0
  risk_per_trade_pct: 1.0
  max_position_pct: 20.0
  max_open_positions: 3
  cooldown_seconds: 300
  max_daily_loss_pct: 3.0
  slippage_pct: 0.05
  trailing_stop_pct: 2.0       # trailing stop as % of entry price (0 = disabled)

schedule:
  market_tick_seconds: 60
  analytics_minutes: 30
  daily_analytics_hour: 0
  ai_review_hour: 6
  reconcile_minutes: 15

ai:
  enabled: false          # auto-enabled when AI_API_KEY is set in .env
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  temperature: 0.2
  max_recommendations_per_review: 1
  images_enabled: true    # accept Telegram photos/screenshots (needs USE_HERMES=true)
  image_max_bytes: 5000000  # reject larger uploads (phone storage + provider limits)
  image_dir: data/uploads # repo-relative; files are deleted right after the AI reads them

# --- Internal HTTP API (optional health/status; requires API_TOKEN in .env) ---
api:
  enabled: false          # set true + API_TOKEN to expose /health and /status
  host: 127.0.0.1         # keep loopback; never expose to the public internet
  port: 8000

# --- Logging ---
log_level: INFO
log_format: text          # "text" (human-readable) or "json" (structured)
log_json_fields:          # fields to include in JSON output (when log_format: json)
  - timestamp
  - level
  - logger
  - message
  - correlation_id

# --- Strategy ---
strategy:
  hot_reload: true       # auto-reload active strategy when settings.yaml/strategies.yaml change

# --- Modules (plug-and-play parts) ---
# Every non-execution subsystem is a module selected by name. See
# algotrading/modules/ and PROJECT_MAP.md for the full roster.
#
#   enabled: null       -> auto-select from mode/demo (recommended)
#   enabled: [names]    -> use exactly these modules
#   disabled: [names]   -> drop these from the selection (execution is locked)
#   external: [paths]   -> import extra modules, e.g. "my_pkg.mod:MyModule"
#   params: {name: {..}}-> constructor params for a module
modules:
  enabled: null
  disabled: []
  external: []
  params: {}
  strategy_plugin_paths:   # user/AI-authored strategy files live here
    - strategies
  autoload_strategies: true

# --- Prometheus metrics (optional; requires prometheus-client) ---
metrics:
  enabled: false          # set true to expose /metrics endpoint (open, no auth)
