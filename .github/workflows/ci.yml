name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest + PROJECT_MAP check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Match the Termux-tested environment: the code uses pydantic v1
          # APIs (parse_obj / class Config), and requirements.txt only says
          # >=1.10.26 — which would resolve to pydantic v2 on CI.
          python -m pip install "pydantic>=1.10.26,<2"
          python -m pip install -r requirements.txt

      - name: Verify PROJECT_MAP.md is in sync
        run: bash scripts/check_project_map.sh

      - name: Run tests
        run: python -m pytest tests/ -q